name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Build
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/RyanGarber/v10m
        cacheFrom: ghcr.io/RyanGarber/v10m
        push: never
        runCmd: node build.js
        
    - name: Notify
      run: |
        curl -X POST $DEPLOY_URL -H "Authorization: Bearer $DEPLOY_TOKEN"
      env:
        DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
